     --accent  primary action colour     --hl   flow and highlight colour

}

  --bg:#f8f3fc; --bg2:#efe6f7; --card:#ffffff; --card2:#f4ecfa; --line:#d9c8e8; --ink:#2a1c3a; --muted:#6c5a82;
  --accent:#8a4fc9; --on-accent:#ffffff; --hl:#c07a1a; --good:#1c9a6e;
  --k1:#0e8ea0; --k2:#6a5ad6; --k3:#1c9a6e; --k4:#d9720d; --k5:#c9306a; --k6:#6a9a0a; --k7:#81709a; --k8:#7a62c8; --k9:#1a8590;
  --viz:#ffffff; --edge:#c9b6de; --sink:#2a1c3a; --smute:#6c5a82; --shd:rgba(80,40,120,.16);
}

/* ---------- base ---------- */
:root{ --radius:18px; --shadow:0 5px 0 var(--shd); --font:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --kai:"Kaiti SC","STKaiti","KaiTi","BiauKai","Songti SC","PingFang SC","Noto Serif CJK SC",serif; }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);background:radial-gradient(1200px 600px at 85% -10%,var(--bg2),var(--bg));color:var(--ink);line-height:1.45;
  height:100dvh;display:flex;flex-direction:column;overflow:hidden}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--hl);outline-offset:3px;border-radius:10px}
button{font:inherit;color:inherit}

/* ---------- header ---------- */
.top{flex:none;display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:2px solid var(--line);background:color-mix(in srgb,var(--bg) 85%,transparent)}
.brand{display:flex;flex-direction:column;min-width:0}
h1{font-size:clamp(1.25rem,2.6vw,1.8rem);font-weight:900;letter-spacing:-.02em;line-height:1.05;white-space:nowrap;
  background:linear-gradient(90deg,var(--accent),var(--k5) 55%,var(--k1));-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{font-size:.82rem;font-weight:800;color:var(--muted);white-space:nowrap}
.tagline b{color:var(--good)}
.tabs{display:flex;gap:6px;margin-left:auto;overflow-x:auto;padding:4px 2px}
.tab{cursor:pointer;font-weight:900;font-size:.9rem;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 3px 0 var(--shd)}
.iconbtn{cursor:pointer;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:6px 11px;font-weight:900}
@media(max-width:760px){.tagline{display:none}.top{gap:8px;flex-wrap:wrap}.tabs{order:3;width:100%;margin-left:0}}

/* ---------- stage area ---------- */
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;padding:12px 16px 14px}
.view[hidden]{display:none}
.view.plain{display:block;overflow:auto}
.view.plain[hidden]{display:none}
.viz{min-height:0;min-width:0;display:flex;align-items:center;background:var(--viz);border:2px solid var(--line);border-radius:var(--radius);padding:8px;overflow:auto}
.viz svg{display:block;width:100%;height:100%;min-width:760px;max-height:100%}
.side{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px}
@media(max-width:1000px){.view{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}.side{max-height:46vh}}

.story{flex:none;border-radius:16px;padding:12px 16px;background:var(--card2);border:2px solid var(--accent);box-shadow:var(--shadow)}
.story .n{font-size:.72rem;font-weight:900;letter-spacing:.09em;color:var(--accent);text-transform:uppercase}
.story .h{font-size:clamp(1.25rem,2.4vw,1.65rem);font-weight:900;line-height:1.1;margin:2px 0 4px}
.story .t{font-size:.95rem}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{cursor:pointer;width:34px;height:34px;border-radius:50%;font-weight:900;border:2px solid var(--line);background:var(--card)}
.dot[aria-current="step"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);transform:scale(1.12)}
.dot.seen{border-color:var(--good)}
.ctrl{display:flex;gap:8px;flex-wrap:wrap}
.btn{cursor:pointer;font-weight:800;border:0;border-radius:14px;padding:9px 16px;color:var(--on-accent);background:var(--accent);box-shadow:0 4px 0 var(--shd);transition:transform .08s,box-shadow .08s,filter .15s}
.btn:hover{filter:brightness(1.08)} .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shd)}
.btn.ghost{background:var(--card2);color:var(--ink);border:2px solid var(--line)}
.persona{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.85rem}
.persona[hidden]{display:none}
.f{cursor:pointer;font-weight:800;border:2px solid var(--line);background:var(--card2);border-radius:999px;padding:5px 12px;font-size:.85rem}
.f[aria-pressed="true"]{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--on-accent)}

.detail{flex:none;border-radius:16px;padding:12px 16px;border:2px solid var(--line);background:var(--card2);border-left:10px solid var(--c,var(--accent))}
.detail h3{font-size:1.2rem}
.detail .layer{font-size:.7rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.detail dl{margin:6px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:.92rem}
.detail dt{font-weight:900;color:var(--muted)} .detail dd{margin:0}
.detail .next{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.detail .hintp{font-size:.92rem;color:var(--muted)}

/* ---------- SVG diagram ---------- */
.dg .node{cursor:pointer;transition:opacity .25s}
.dg .node rect.body{transition:filter .2s,stroke-width .2s}
.dg .node:hover rect.body{filter:brightness(1.3);stroke-width:5.5}
.dg .node.sel rect.body{stroke-width:6;filter:brightness(1.35) drop-shadow(0 0 12px var(--glow))}
.dg .node.lit rect.body{filter:brightness(1.3) drop-shadow(0 0 10px var(--glow))}
.dg .node.dim{opacity:.2}
.dg .node text{pointer-events:none;font-family:var(--font)}
.dg .node .t1{fill:var(--sink);font-weight:900}
.dg .node .t2{fill:var(--smute);font-weight:600}
.dg .node .gl{fill:var(--sink);font-family:var(--kai);font-weight:700}
.dg .node:focus-visible{outline:none}
.dg .node:focus-visible rect.body{stroke:var(--sink);stroke-width:6}
.dg .eg path.ln{fill:none;stroke:var(--edge);stroke-width:3;opacity:.7;transition:.25s}
.dg .eg path.ah{fill:none;stroke:var(--edge);stroke-width:3;opacity:.8}
.dg .eg.on path.ln,.dg .eg.on path.ah{stroke:var(--hl);stroke-width:5;opacity:1}
.dg .eg.dim{opacity:.15}
.dg .eg .pt{fill:var(--hl);opacity:0}
.dg .eg.on .pt{opacity:1}
.dg .tick{stroke:var(--edge);stroke-width:2;stroke-dasharray:4 5;opacity:.7}
.dg .zone{stroke-width:3;stroke-dasharray:10 7;fill-opacity:.07}
.dg .zl{font-family:var(--font);font-weight:900;font-size:17px;fill:var(--hl)}
.dg .zs{font-family:var(--font);font-weight:700;font-size:12.5px;fill:var(--smute)}
.dg .hd text{font-family:var(--font);font-weight:900;font-size:14px;fill:var(--sink);letter-spacing:.06em}
.dg .hd circle{fill:var(--hl)}
.dg .hd .num{fill:var(--viz);font-size:13px;letter-spacing:0}

/* ---------- catalog view ---------- */
.cols{display:grid;grid-template-columns:repeat(var(--n,7),minmax(130px,1fr));gap:10px;height:calc(100% - 34px);min-height:420px}
.col{background:var(--card);border:2px solid var(--line);border-top:8px solid var(--c);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:7px;box-shadow:var(--shadow)}
.col h3{font-size:.85rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.col .e{font-size:2rem}
.chipb{cursor:pointer;text-align:left;font-weight:800;font-size:.95rem;padding:11px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card2);transition:transform .12s,border-color .12s}
.chipb:hover{transform:translateX(3px);border-color:var(--c)}
.chipb .cn{display:block;font-family:var(--kai);font-size:1.15rem;line-height:1.25}
.chipb small{display:block;font-weight:600;color:var(--muted);font-size:.78rem;margin-top:2px}
.catnote{font-size:.8rem;color:var(--muted);margin-top:10px}
@media(max-width:1000px){.cols{grid-template-columns:repeat(2,1fr);height:auto}}

/* ---------- trace view ---------- */
.tracebox{justify-content:center;background:var(--card);padding:12px}
.tracebox canvas{display:block;width:auto;height:auto;max-width:100%;max-height:100%;border-radius:14px;touch-action:none;cursor:crosshair;box-shadow:var(--shadow)}
.stars{font-size:1.5rem;letter-spacing:.15em;min-height:2rem}
.items{display:flex;flex-wrap:wrap;gap:6px}

/* ---------- ideas view ---------- */
.ideas{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;height:100%}
.idea{position:relative;border-radius:var(--radius);padding:18px 20px;background:var(--card);border:2px solid var(--line);border-left:12px solid var(--c);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;overflow:hidden}
.idea .no{position:absolute;right:14px;top:-4px;font-size:5.5rem;font-weight:900;color:var(--c);opacity:.18;line-height:1}
.idea .em{font-size:2.2rem}
.idea h2{font-size:clamp(1.2rem,2.4vw,1.7rem);font-weight:900;line-height:1.1}
.idea p{font-size:1rem;color:var(--muted);flex:1}
.idea .btn{align-self:flex-start}
@media(max-width:760px){.ideas{grid-template-columns:1fr;height:auto}}

/* ---------- dialogs ---------- */
dialog{border:3px solid var(--accent);border-radius:22px;background:var(--card);color:var(--ink);padding:22px 24px;max-width:min(520px,92vw);box-shadow:0 14px 0 var(--shd)}
dialog::backdrop{background:rgba(8,8,12,.7);backdrop-filter:blur(4px)}
dialog[open]{animation:pop .25s}
dialog h2{font-size:1.5rem;margin:2px 0 6px}
dialog .layer{font-size:.72rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
dialog p{margin:6px 0}
dialog a{color:var(--accent)}
dialog li{margin:5px 0;font-size:.92rem}
dialog .x{float:right}
.swatches{display:grid;gap:8px;margin-top:10px}
.sw{cursor:pointer;display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:var(--card2)}
.sw[aria-pressed="true"]{border-color:var(--accent)}
.sw .chips{display:flex}
.sw .chips i{width:18px;height:28px;display:block}
.sw .chips i:first-child{border-radius:8px 0 0 8px}.sw .chips i:last-child{border-radius:0 8px 8px 0}
.sw small{display:block;color:var(--muted);font-weight:600}

@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <h1 id="title"></h1>
    <span class="tagline" id="tagline"></span>
  </div>
  <div class="tabs" id="tabs" role="tablist" aria-label="Views"></div>
  <button class="iconbtn" id="palBtn" aria-label="Choose colour palette">🎨</button>
  <button class="iconbtn" id="srcBtn" aria-label="Sources and notes">ⓘ</button>
  <button class="iconbtn" id="theme" aria-label="Switch light or dark mode">◐</button>
</header>

<main id="stage"></main>

<dialog id="pop" aria-labelledby="popT">
  <button class="btn ghost x" id="popX" aria-label="Close">✕</button>
  <span class="layer" id="popL"></span>
  <h2 id="popT"></h2>
  <p id="popP" style="font-size:1.15rem;font-weight:800;color:var(--accent)" hidden></p>
  <p id="popA" style="font-size:1.05rem;font-weight:700"></p>
  <p id="popB" style="color:var(--muted)"></p>
  <button class="btn" id="popSay" hidden style="margin-top:8px">🔊 Listen</button>
</dialog>

<dialog id="srcDlg" aria-labelledby="srcT">
  <button class="btn ghost x" id="srcX" aria-label="Close">✕</button>
  <h2 id="srcT">Sources and notes</h2>
  <ul id="srcList" style="padding-left:1.1rem;margin:8px 0"></ul>
  <p style="font-size:.88rem;color:var(--muted)"><b>Made with:</b> plain HTML, CSS, JavaScript and inline SVG. No external libraries. No data leaves this page.</p>
</dialog>

<dialog id="palDlg" aria-labelledby="palT">
  <button class="btn ghost x" id="palX" aria-label="Close">✕</button>
  <h2 id="palT">Colour palette</h2>
  <div class="swatches" id="swatches"></div>
</dialog>

        ctx.save(); ctx.strokeStyle=line; ctx.lineWidth=4; ctx.strokeRect(x+6,6,S-12,S-12);
        ctx.setLineDash([14,12]); ctx.lineWidth=2.5; ctx.beginPath();
        ctx.moveTo(x+S/2,10); ctx.lineTo(x+S/2,S-10); ctx.moveTo(x+10,S/2); ctx.lineTo(x+S-10,S/2);
        ctx.moveTo(x+10,10); ctx.lineTo(x+S-10,S-10); ctx.moveTo(x+S-10,10); ctx.lineTo(x+10,S-10); ctx.stroke(); ctx.restore();
        const a=alpha(); if(a>0){ ctx.save(); ctx.globalAlpha=a; ctx.fillStyle=ink; ctx.font=Math.round(S*0.8)+"px "+KAI; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(ch,x+S/2,S/2+S*0.04); ctx.restore(); }
      });
      ctx.save(); ctx.strokeStyle=acc; ctx.lineWidth=17; ctx.lineCap="round"; ctx.lineJoin="round";
      strokes.concat(cur?[cur]:[]).forEach(st=>{ ctx.beginPath(); st.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); if(st.length===1) ctx.lineTo(st[0][0]+.1,st[0][1]); ctx.stroke(); });
      ctx.restore();
    }
    const pt=e=>{ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]; };
    cv.addEventListener("pointerdown",e=>{ cv.setPointerCapture(e.pointerId); cur=[pt(e)]; draw(); });
    cv.addEventListener("pointermove",e=>{ if(!cur)return; cur.push(pt(e)); draw(); });
    const end=()=>{ if(cur){ strokes.push(cur); cur=null; draw(); } };
    cv.addEventListener("pointerup",end); cv.addEventListener("pointercancel",end);
    const story=(n,h,t)=>{ $(".story .n",side).textContent=n; $(".story .h",side).textContent=h; $(".story .t",side).textContent=t; };
    function info(msg){
      const it=items[idx]; $(".stars",side).textContent=Array.from({length:rep},(_,i)=>i<counts[idx]?"⭐":"☆").join(" ");
      const hint=counts[idx]>=rep?"Finished!":counts[idx]===rep-1?"Last round. The guide is gone. Write from memory.":counts[idx]===0?"Trace the grey shape.":"The guide is lighter now.";
      story("Write it · "+(idx+1)+" of "+items.length,it.text+(it.pinyin?"  "+it.pinyin:""),msg||[it.meaning,it.note,hint].filter(Boolean).join(" · "));
      $$(".f",side).forEach((b,i)=>{ b.textContent=items[i].text+(counts[i]>=rep?" ✓":""); b.setAttribute("aria-pressed",String(i===idx)); });
    }
    function pick(i){ idx=i; strokes=[]; cur=null; force=null; size(); draw(); info(); }
    items.forEach((it,i)=>{ const b=el("button","f",it.text); b.type="button"; b.style.fontFamily=KAI; b.style.fontSize="1.15rem"; b.addEventListener("click",()=>pick(i)); $(".items",side).appendChild(b); });
    $(".done",side).addEventListener("click",()=>{
      if(!strokes.length){ info("Write first. Then press Done."); return; }
      if(counts[idx]<rep) counts[idx]++; strokes=[]; force=null; draw();
      const all=counts.every(c=>c>=rep);
      info(all?"You wrote every one "+rep+" times. 🎉":counts[idx]>=rep?"Great! "+items[idx].text+" is finished. Pick the next one.":null);
    });
    $(".undo",side).addEventListener("click",()=>{ strokes.pop(); draw(); });
    $(".clr",side).addEventListener("click",()=>{ strokes=[]; draw(); });
    $(".guide",side).addEventListener("click",()=>{ force=alpha()>0?0:.3; draw(); });
    const sayb=$(".say",side); if(!canSpeak) sayb.hidden=true;
    sayb.addEventListener("click",()=>speak(items[idx].speak||items[idx].text,SAYLANG));
    window.addEventListener("anyhow-restyle",draw);
    size(); draw(); info();
    return {};
  }

  /* ---------- views + tabs ---------- */
  const reg={}, tabsEl=$("#tabs"), stageEl=$("#stage");
  D.views.forEach((V,idx)=>{
    const tab=el("button","tab",(V.icon?V.icon+" ":"")+V.tab); tab.type="button"; tab.setAttribute("role","tab"); tab.id="t-"+V.id; tab.setAttribute("aria-controls","v-"+V.id);
    tabsEl.appendChild(tab);
    const sec=el("section","view"); sec.id="v-"+V.id; sec.setAttribute("role","tabpanel"); sec.setAttribute("aria-labelledby",tab.id); stageEl.appendChild(sec);
    const api=V.type==="diagram"?diagramView(sec,V,reg):V.type==="catalog"?catalogView(sec,V):V.type==="trace"?traceView(sec,V):ideasView(sec,V,reg);
    reg[V.id]={tab,sec,api};
    tab.addEventListener("click",()=>setTab(V.id));
  });
  function setTab(id){
    Object.entries(reg).forEach(([k,r])=>{ const on=k===id; r.tab.setAttribute("aria-selected",String(on)); r.tab.tabIndex=on?0:-1; r.sec.hidden=!on; if(r.api&&r.api.onShow){ on?r.api.onShow():r.api.onHide(); } });
  }
  tabsEl.addEventListener("keydown",e=>{
    if(e.key!=="ArrowRight"&&e.key!=="ArrowLeft") return;
    const ids=Object.keys(reg), cur=ids.findIndex(k=>reg[k].tab.getAttribute("aria-selected")==="true"), n=ids[(cur+(e.key==="ArrowRight"?1:ids.length-1))%ids.length];
    setTab(n); reg[n].tab.focus();
  });
  setTab(D.views[0].id);
})();

</script>
</body>
</html>
