<!doctype html>
<html lang="en" data-palette="{{PALETTE}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
<script>
  /* set before first paint so the page never flashes the wrong appearance */
  (function () { try { var t = localStorage.getItem('report-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {} })();
</script>
<style>
{{CSS}}
</style>
</head>
<body>
<header class="masthead"><div class="wrap" id="masthead"></div></header>
<nav class="tabbar" id="tabbar" aria-label="Report sections"><div class="wrap"><div class="tabs" id="tabs" role="tablist"></div></div></nav>
<main><div class="wrap" id="panels"></div></main>
<footer><div class="wrap" id="foot"></div></footer>
<div class="tip" id="tip" role="presentation"></div>

<!-- Report content. Edit this JSON, or rebuild with: node scripts/build.mjs <this-file.html> <this-file.html> -->
<script type="application/json" id="report">
{{CONTENT}}
</script>
{{LIBS}}
<script>
{{ENGINE}}
</script>
</body>
</html>
